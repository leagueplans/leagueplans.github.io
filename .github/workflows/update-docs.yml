name: Update docs
on: push

# Builds the deployed site and publishes it to docs/.
jobs:
  update-docs:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: Identify changes
      uses: dorny/paths-filter@v4
      id: identify-changes
      with:
        base: ${{ github.ref }}
        filters: |
          sources:
          - 'codec/js/src/main/**'
          - 'codec/shared/src/main/**'
          - 'common/js/src/main/**'
          - 'common/shared/src/main/**'
          - 'uicommon/src/main/**'
          - 'uicommon/package.json'
          - 'ui/src/main/**'
          - 'ui/package.json'
          - 'ui/vite.config.js'
          - 'package.json'
          - 'package-lock.json'
          - 'vite.shared.js'
          - 'project/**'
          - 'build.sbt'

    - uses: actions/setup-node@v7
      if: steps.identify-changes.outputs.sources == 'true'
      with:
        node-version: 22

    - uses: coursier/cache-action@v8
      if: steps.identify-changes.outputs.sources == 'true'

    - uses: actions/setup-java@v6
      if: steps.identify-changes.outputs.sources == 'true'
      with:
        distribution: temurin
        java-version: 17

    - uses: sbt/setup-sbt@v1
      if: steps.identify-changes.outputs.sources == 'true'
      with:
        sbt-runner-version: 1.13.0

    # The Scala.js tests import npm packages (uicommon's fuse.js façade), which have to be
    # installed for them to link.
    - name: Install npm packages
      if: steps.identify-changes.outputs.sources == 'true'
      run: npm ci

    # Publishing to docs/ is a deployment, so it has to be gated on the tests for the code
    # being deployed. Running them here rather than depending on the Test workflow keeps
    # that guarantee in one job: if this step fails, the bundle is never built and docs/ is
    # never touched.
    #
    # Only the modules that reach the bundle. The scraper and the dev tools are covered by
    # the Test workflow, and a regression in one of those should not hold up a release.
    - name: Test deployed modules
      if: steps.identify-changes.outputs.sources == 'true'
      run: sbt codecJS/test commonJS/test uicommon/test ui/test

    - name: Bundle javascript
      id: bundle-js
      if: steps.identify-changes.outputs.sources == 'true'
      run: npm run build

    - name: Sync docs
      if: ${{ (github.ref == 'refs/heads/master') && (steps.bundle-js.outcome == 'success') }}
      run: |
        ./.github/scripts/sync_docs.sh
        ./.github/scripts/commit_docs.sh
