name: Test
on:
  push:
  pull_request:

# The tests run third-party code (npm packages, and the build's plugins and libraries), so they
# get only read access, and the checkout doesn't save its token.
permissions:
  contents: read

jobs:
  test:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # The Scala.js tests import npm packages (scrapereview's use fuse.js), which have to be
    # installed for them to link.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    - name: Install npm packages
      run: npm ci

    - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: 17

    - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      with:
        sbt-runner-version: 1.13.0

    - name: Run tests
      run: sbt test
