name: Scrape
on:
  workflow_dispatch:
    inputs:
      resource:
        type: choice
        description: 'Key for the resource to scrape'
        options:
        - items
        - skill-icons

# The scrape runs third-party code (the build's plugins and libraries) on pages from the wiki, so
# it gets no write access. Where its output goes into the UI as it is, a second job checks it and
# opens the pull request. Neither job saves its token where the steps after checkout can read it.
permissions: {}

jobs:
  scrape:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: coursier/cache-action@057d08c2f9a2c4e7a4d33df3aae657b7db88b8cc # v8.2.0

    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: 17

    - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      with:
        sbt-runner-version: 1.13.0

    - name: Run scraper
      env:
        RESOURCE: ${{ github.event.inputs.resource }}
      run: ./.github/scripts/scrape_wiki.sh "$RESOURCE"

    - name: Archive run logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: run-logs
        path: logs/run.log
        if-no-files-found: warn

    # The items scraper deliberately changes nothing in the repository. Its output is a
    # changeset to be reviewed locally, so it is published as an artefact and the report
    # goes to the run summary rather than a pull request body.
    - name: Publish report
      if: github.event.inputs.resource == 'items'
      run: cat tmp/report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Archive changeset
      if: github.event.inputs.resource == 'items'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: items-changeset
        path: tmp/dump

    # With any hidden files, so that the next job's check sees everything the scrape wrote
    - name: Archive scrape
      if: github.event.inputs.resource != 'items'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: scrape
        path: tmp/dump
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1

    - name: Archive report
      if: github.event.inputs.resource != 'items'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: report
        path: tmp/report.md
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: scrape
    if: github.event.inputs.resource != 'items'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: scrape
        path: tmp/dump

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: report
        path: tmp

    # Checks that the scrape wrote only what it should have, then copies it into the UI
    - name: Sync the scrape
      env:
        RESOURCE: ${{ github.event.inputs.resource }}
      run: ./.github/scripts/sync_scrape.sh "$RESOURCE"

    - name: Read report
      id: read-report
      run: |
        delimiter="$(openssl rand -hex 8)"
        report=$(cat tmp/report.md)
        echo "report<<$delimiter" >> $GITHUB_OUTPUT
        echo "$report" >> $GITHUB_OUTPUT
        echo "$delimiter" >> $GITHUB_OUTPUT

    - name: Raise PR for any changes
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        commit-message: Update ${{ github.event.inputs.resource }}
        branch: scraper/${{ github.event.inputs.resource }}
        delete-branch: true
        title: Update ${{ github.event.inputs.resource }}
        body: |
          Triggered by workflow [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          ---
          ${{ steps.read-report.outputs.report }}
